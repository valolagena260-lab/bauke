<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY TV - YC Earn & Withdraw</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            text-align: center; 
            padding: 15px; 
            margin: 0; 
        }
        .container {
            max-width: 420px;
            margin: auto;
        }
        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); 
            border: 1px solid #334155;
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #60a5fa; font-size: 22px; }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            border: 1px solid #334155;
        }
        .stat-item span { display: block; font-size: 18px; font-weight: bold; color: #34d399; }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: 600;
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { background: #475569; cursor: not-allowed; transform: none; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #fff; 
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: var(--primary); }
        
        #adblock-warning { 
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: #fca5a5; 
            padding: 10px;
            border-radius: 8px;
            font-size: 13px; 
            display: none; 
            margin-bottom: 15px; 
        }
        #timer-text { font-size: 14px; color: var(--text-muted); margin-top: 12px; min-height: 20px; }
        .divider { margin: 20px 0; border: 0; height: 1px; background: #334155; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🎯 MY TV YC Task</h2>
        
        <div class="stats-box">
            <div class="stat-item">
                <span id="balance">0.00</span>
                <div class="stat-label">ব্যালেন্স (YC)</div>
            </div>
            <div class="stat-item">
                <span id="tasks-left">10</span>
                <div class="stat-label">বাকি টাস্ক</div>
            </div>
        </div>
        
        <div id="adblock-warning">⚠️ অ্যাডব্লকার অন করা আছে! দয়া করে অ্যাডব্লকার বন্ধ করুন।</div>
        
        <div id="task-box">
            <button id="task-btn" onclick="startTask()">বিজ্ঞাপন দেখুন (Task Start)</button>
            <p id="timer-text">১৫ সেকেন্ড বিজ্ঞাপন দেখে টাস্ক কমপ্লিট করুন</p>
        </div>

        <hr class="divider">

        <h3 style="font-size: 16px; margin-bottom: 5px; text-align: left;">💳 উইথড্র (Withdraw)</h3>
        <p style="font-size: 12px; color: var(--text-muted); text-align: left; margin-top: 0;">মিনিমাম ১ YC হলেই উইথড্র করতে পারবেন।</p>
        <input type="text" id="wallet-id" placeholder="MY TV Wallet ID দিন">
        <button style="background: var(--success); margin-top: 12px;" onclick="requestWithdraw()">উইথড্র রিকোয়েস্ট পাঠান</button>
    </div>
</div>

<script>
    let balance = parseFloat(localStorage.getItem('yc_balance')) || 0.0;
    let tasksLeft = localStorage.getItem('tasks_left') !== null ? parseInt(localStorage.getItem('tasks_left')) : 10;
    
    document.getElementById('balance').innerText = balance.toFixed(2);
    document.getElementById('tasks-left').innerText = tasksLeft;

    // অ্যাডব্লকার ডিটেক্ট
    let ad = document.createElement('div');
    ad.innerHTML = '&nbsp;';
    ad.className = 'adsbox';
    document.body.appendChild(ad);
    window.setTimeout(function() {
        if (ad.offsetHeight === 0) {
            document.getElementById('adblock-warning').style.display = 'block';
            document.getElementById('task-btn').disabled = true;
        }
        ad.remove();
    }, 100);

    let countdown = null;
    let timeLeft = 15;
    let isTaskRunning = false;
    let adWindow = null;

    function startTask() {
        if (tasksLeft <= 0) {
            alert("আজকের টাস্ক শেষ! কাল আবার চেষ্টা করুন।");
            return;
        }

        let btn = document.getElementById('task-btn');
        let timerText = document.getElementById('timer-text');
        btn.disabled = true;
        isTaskRunning = true;

        // আপনার অ্যাডস্টাররা ডাইরেক্ট বা পপওভার লিংক এখানে দিন
        let adUrl = "https://www.effectivecpmnetwork.com/q45emcu9s?key=47cdb5711119cee95fdb490cd5c91b3c"; 
        adWindow = window.open(adUrl, "_blank");

        timeLeft = 15;
        timerText.innerText = `বিজ্ঞাপন লোড হচ্ছে... ${timeLeft} সেকেন্ড বাকি`;

        countdown = setInterval(() => {
            // যদি ইউজার অ্যাড উইন্ডো কেটে দেয়
            if (adWindow && adWindow.closed) {
                clearInterval(countdown);
                isTaskRunning = false;
                timerText.innerText = "⚠️ আপনি বিজ্ঞাপন উইন্ডো বন্ধ করে দিয়েছেন! টাস্ক বাতিল।";
                btn.disabled = false;
                return;
            }

            timeLeft--;
            timerText.innerText = `দয়া করে অপেক্ষা করুন... ${timeLeft} সেকেন্ড`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                isTaskRunning = false;
                if(adWindow) adWindow.close();
                
                balance += 0.10;
                tasksLeft--;
                
                localStorage.setItem('yc_balance', balance.toFixed(2));
                localStorage.setItem('tasks_left', tasksLeft);

                document.getElementById('balance').innerText = balance.toFixed(2);
                document.getElementById('tasks-left').innerText = tasksLeft;
                
                timerText.innerText = "🎉 অভিনন্দন! ০.১০ YC আপনার একাউন্টে যোগ হয়েছে।";
                btn.disabled = false;
            }
        }, 1000);
    }

    // অ্যান্টি-চিট: ইউজার অন্য ট্যাবে বা স্ক্রিনে চলে গেলে কাউন্টডাউন পজ হবে
    document.addEventListener("visibilitychange", function() {
        if (document.hidden && isTaskRunning) {
            clearInterval(countdown);
            let timerText = document.getElementById('timer-text');
            timerText.innerText = "⏸️ আপনি অন্য স্ক্রিনে চলে গেছেন! কাউন্টডাউন থেমে গেছে। ফিরে আসুন।";
        } else if (!document.hidden && isTaskRunning && timeLeft > 0) {
            let timerText = document.getElementById('timer-text');
            timerText.innerText = `▶️ আবার শুরু হয়েছে... ${timeLeft} সেকেন্ড বাকি`;
            
            countdown = setInterval(() => {
                if (adWindow && adWindow.closed) {
                    clearInterval(countdown);
                    isTaskRunning = false;
                    timerText.innerText = "⚠️ বিজ্ঞাপন উইন্ডো বন্ধ করা হয়েছে! টাস্ক বাতিল।";
                    document.getElementById('task-btn').disabled = false;
                    return;
                }

                timeLeft--;
                timerText.innerText = `দয়া করে অপেক্ষা করুন... ${timeLeft} সেকেন্ড`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    isTaskRunning = false;
                    if(adWindow) adWindow.close();
                    
                    balance += 0.10;
                    tasksLeft--;
                    
                    localStorage.setItem('yc_balance', balance.toFixed(2));
                    localStorage.setItem('tasks_left', tasksLeft);

                    document.getElementById('balance').innerText = balance.toFixed(2);
                    document.getElementById('tasks-left').innerText = tasksLeft;
                    
                    timerText.innerText = "🎉 অভিনন্দন! ০.১০ YC আপনার একাউন্টে যোগ হয়েছে।";
                    document.getElementById('task-btn').disabled = false;
                }
            }, 1000);
        }
    });

    function requestWithdraw() {
        let walletId = document.getElementById('wallet-id').value.trim();
        if (!walletId) {
            alert("দয়া করে আপনার MY TV Wallet ID দিন!");
            return;
        }
        if (balance < 1) {
            alert("উইথড্র করার জন্য কমপক্ষে ১ YC প্রয়োজন!");
            return;
        }

        fetch('/api/withdraw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet_id: walletId, amount: balance, username: "TelegramUser", user_id: "12345" })
        })
        .then(res => res.json())
        .then(data => {
            alert("সফলভাবে উইথড্র রিকোয়েস্ট পাঠানো হয়েছে! অ্যাডমিন চেক করে পেমেন্ট পাঠিয়ে দেবেন।");
            balance = 0;
            localStorage.setItem('yc_balance', 0);
            localStorage.setItem('tasks_left', 10);
            document.getElementById('balance').innerText = "0.00";
            document.getElementById('tasks-left').innerText = "10";
            document.getElementById('wallet-id').value = "";
        })
        .catch(err => {
            alert("সমস্যা হয়েছে, আবার চেষ্টা করুন।");
        });
    }
</script>

</body>
</html>
